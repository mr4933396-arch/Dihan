<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Track Order | WS TOP UP</title>

<body><main class="wrap"><section class="card"><h1>WS TOP UP · Order Tracking</h1><p class="muted">Your order status, without customer login.</p><div id="result">Loading order details…</div><p><a href="index.html">← Back to store</a></p></section></main>
<script>
(async()=>{const ref=new URLSearchParams(location.search).get("ref");const el=document.getElementById("result");if(!ref||!/^[a-f0-9]{36}$/.test(ref)){el.textContent="Invalid order reference.";return;}try{const r=await fetch("https://ghjzqytxqushxvjlvkls.supabase.co/functions/v1/ws-orders?ref="+encodeURIComponent(ref),{headers:{"apikey":"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdoanpxeXR4cXVzaHh2amx2a2xzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyNDY4NDksImV4cCI6MjExMDgyMjg0OX0.6HOxZqQhvzbcq5zzEiLZchfp3t15sJ8qAsOxI-gjhEI","Authorization":"Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdoanpxeXR4cXVzaHh2amx2a2xzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyNDY4NDksImV4cCI6MjExMDgyMjg0OX0.6HOxZqQhvzbcq5zzEiLZchfp3t15sJ8qAsOxI-gjhEI"}});const d=await r.json();if(!r.ok)throw new Error(d.error||"Order not found");const amount=(Number(d.amount_paise)/100).toFixed(2);const date=new Date(d.created_at).toLocaleString();el.innerHTML="<p><b>Order ID: #"+d.id+"</b></p><p>Product: "+safe(d.product_name)+"</p><p>Package: "+safe(d.package_name)+"</p><p>Amount: ₹"+amount+"</p><div class='status'>Payment: <b>"+safe(d.payment_status)+"</b></div><div class='status'>Order: <b>"+safe(d.order_status)+"</b></div><p class='muted'>Created: "+date+"</p><p class='muted'>Payment and delivery are confirmed manually by WS TOP UP.</p>";}catch(e){el.textContent=e.message||"Unable to load order.";}function safe(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}})();
</script></body></html>
