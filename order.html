<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Track Order | WS TOP UP</title>
<style>body{margin:0;background:#07111f;color:#f5f8ff;font:15px system-ui,Arial}.wrap{max-width:560px;margin:35px auto;padding:20px}.card{background:#102139;border:1px solid #2b4562;border-radius:15px;padding:20px}h1{color:#45d8ff}.muted{color:#9eb0c6}.status{padding:10px;border-radius:9px;background:#142740;margin:10px 0}a{color:#45d8ff}</style></head>
<body><main class="wrap"><section class="card"><h1>WS TOP UP · Order Tracking</h1><p class="muted">Your order status, without customer login.</p><div id="result">Loading order details…</div><button id="refresh" type="button" style="background:#16496a;color:#fff;border:1px solid #45d8ff;border-radius:9px;padding:10px 14px;margin:8px 0;cursor:pointer">Refresh status</button><p class="muted" id="updated">Status refreshes automatically every 20 seconds.</p><p><a href="index.html">← Back to store</a></p></section></main>
<script>
(async()=>{
 const ref=new URLSearchParams(location.search).get("ref");
 const el=document.getElementById("result"),refresh=document.getElementById("refresh"),updated=document.getElementById("updated");
 if(!ref||!/^[a-f0-9]{36}$/.test(ref)){el.textContent="Invalid order reference.";refresh.disabled=true;return;}
 async function load(){
  refresh.disabled=true;refresh.textContent="Refreshing…";
  try{
   const r=await fetch("https://ghjzqytxqushxvjlvkls.supabase.co/functions/v1/ws-orders?ref="+encodeURIComponent(ref),{headers:{"apikey":"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdoanpxeXR4cXVzaHh2amx2a2xzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyNDY4NDksImV4cCI6MjExMDgyMjg0OX0.6HOxZqQhvzbcq5zzEiLZchfp3t15sJ8qAsOxI-gjhEI","Authorization":"Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdoanpxeXR4cXVzaHh2amx2a2xzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyNDY4NDksImV4cCI6MjExMDgyMjg0OX0.6HOxZqQhvzbcq5zzEiLZchfp3t15sJ8qAsOxI-gjhEI"}});
   const d=await r.json();if(!r.ok)throw new Error(d.error||"Order not found");
   const amount=(Number(d.amount_paise)/100).toFixed(2),date=new Date(d.created_at).toLocaleString();
   const payment=d.payment_status==="paid"?"Paid":"Unpaid — awaiting payment verification";
   const order=d.order_status==="completed"?"Completed":d.order_status==="pending"?"Pending — processing after payment verification":d.order_status;
   const isVertex=Boolean(d.vertex_order_id||d.vertex_order_status);
   const rawSupplier=String(d.vertex_order_status||"").toLowerCase();
   const supplierLabel=d.vertex_order_id
    ? (["completed","complete","success","successful","delivered"].includes(rawSupplier)?"Delivered":["failed","cancelled","canceled","rejected"].includes(rawSupplier)?"Supplier reported a problem":"Supplier order accepted")
    : rawSupplier==="submission_failed"?"Payment received — supplier submission needs support"
    : rawSupplier==="submitting"?"Payment received — sending order to supplier"
    : "Waiting for confirmed payment";
   const supplierDetail=d.vertex_order_id?"Supplier reference: "+safe(d.vertex_order_id)
    : rawSupplier==="submission_failed"?"Please contact WS TOP UP support. Your payment status is recorded; do not pay again."
    : "Automatic delivery starts only after payment is verified.";
   const supplierError=d.vertex_error?"<p class='muted'>Support detail: "+safe(d.vertex_error)+"</p>":"";
   const supplierBox=isVertex?"<div class='status'>Vertex delivery: <b>"+safe(supplierLabel)+"</b><p class='muted'>"+supplierDetail+"</p>"+supplierError+"</div>":"";
   el.innerHTML="<p><b>Order ID: #"+d.id+"</b></p><p>Product: "+safe(d.product_name)+"</p><p>Package: "+safe(d.package_name)+"</p><p>Amount: ₹"+amount+"</p><div class='status'>Payment: <b>"+safe(payment)+"</b></div><div class='status'>Order: <b>"+safe(order)+"</b></div>"+supplierBox+"<p class='muted'>Created: "+date+"</p><p class='muted'>Payment and delivery are confirmed by WS TOP UP after verification.</p>";
   updated.textContent="Last checked: "+new Date().toLocaleTimeString();
  }catch(e){el.textContent=e.message||"Unable to load order.";}
  finally{refresh.disabled=false;refresh.textContent="Refresh status";}
 }
 function safe(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
 refresh.addEventListener("click",load);await load();setInterval(load,20000);
})();
</script></body></html>
