<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login | WS TOP UP</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body data-page="login">
  <main class="auth-wrap">
    <div class="brand"><a href="./index.html">WS <span>TOP UP</span></a></div>
    <section class="card">
      <h1>Login</h1>
      <p class="sub">Login with your mobile number and password. মোবাইল নম্বর ও পাসওয়ার্ড দিয়ে লগইন করো।</p>
      <form id="login-form">
        <label for="phone">Mobile Number / মোবাইল নম্বর</label>
        <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Enter 10-digit mobile number" required>
        <label for="password">Password / পাসওয়ার্ড</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
        <button type="submit">Login / লগইন</button>
      </form>
      <div id="message" class="message" role="status"></div>
      <div class="links"><a href="./register.html">Create New Account / নতুন অ্যাকাউন্ট তৈরি করো</a></div>
    </section>
  </main>
  <script type="module" src="./auth.js"></script>
</body>
</html>
