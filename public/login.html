<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | WS TOP UP</title><link rel="stylesheet" href="./style.css"></head>
<body data-page="login"><main class="auth-wrap"><div class="brand"><a href="./index.html">WS <span>TOP UP</span></a></div><section class="card"><h1>লগইন</h1><p class="sub">মোবাইল নম্বর ও পাসওয়ার্ড দিয়ে লগইন করো।</p><form id="login-form"><label for="phone">মোবাইল নম্বর</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="10 digit mobile number" required><label for="password">পাসওয়ার্ড</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">লগইন</button></form><div id="message" class="message" role="status"></div><div class="links"><a href="./register.html">নতুন অ্যাকাউন্ট তৈরি করো</a></div></section></main><script type="module" src="./auth.js"></script></body></html>
