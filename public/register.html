<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | WS TOP UP</title><link rel="stylesheet" href="./style.css"></head>
<body data-page="register"><main class="auth-wrap"><div class="brand"><a href="./index.html">WS <span>TOP UP</span></a></div><section class="card"><h1>নতুন অ্যাকাউন্ট</h1><p class="sub">শুধু মোবাইল নম্বর ও পাসওয়ার্ড দিয়ে রেজিস্ট্রেশন করো।</p><form id="register-form"><label for="phone">মোবাইল নম্বর</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="10 digit mobile number" required><label for="password">পাসওয়ার্ড (কমপক্ষে ৮ অক্ষর)</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><button type="submit">রেজিস্ট্রেশন</button></form><div id="message" class="message" role="status"></div><div class="links"><a href="./login.html">আগে অ্যাকাউন্ট আছে? লগইন করো</a></div></section></main><script type="module" src="./auth.js"></script></body></html>
