<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | WS TOP UP</title><link rel="stylesheet" href="./assets/style.css"></head>
<body data-page="register"><main class="auth-wrap"><div class="brand"><a href="../index.html">WS <span>TOP UP</span></a></div><section class="card"><h1>Create Account</h1><p class="sub">নতুন অ্যাকাউন্ট তৈরি করো।</p><form id="register-form"><label for="name">তোমার নাম</label><input id="name" type="text" autocomplete="name" maxlength="70" required><label for="email">Email Address</label><input id="email" type="email" autocomplete="email" required><label for="password">Password (কমপক্ষে ৮ অক্ষর)</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><button type="submit">Register</button></form><div id="message" class="message" role="status"></div><div class="links"><a href="./login.html">Already have an account? Login</a></div></section></main><script type="module" src="./assets/auth.js"></script></body></html>
