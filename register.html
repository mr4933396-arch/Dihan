<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Create Account | WS TOP UP</title><link rel="stylesheet" href="./customer-auth.css"></head>
<body data-page="register"><main class="auth-wrap"><div class="brand"><a href="./index.html">WS <span>TOP UP</span></a></div><section class="auth-card"><h1>Create Account / অ্যাকাউন্ট তৈরি</h1><p class="sub">ইমেইল ও নতুন পাসওয়ার্ড দিয়ে ফ্রি অ্যাকাউন্ট তৈরি করো।</p><form id="register-form"><label for="name">Full Name / পুরো নাম</label><input id="name" type="text" autocomplete="name" maxlength="70" required><label for="email">Email Address / ইমেইল</label><input id="email" type="email" inputmode="email" autocomplete="email" required><label for="password">Create Password / পাসওয়ার্ড (কমপক্ষে ৮ অক্ষর)</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label for="confirm-password">Confirm Password / আবার পাসওয়ার্ড দাও</label><input id="confirm-password" type="password" minlength="8" autocomplete="new-password" required><button type="submit">Register / রেজিস্টার</button></form><div id="message" class="message" role="status" aria-live="polite"></div><div class="auth-links"><a href="./login.html">Already registered? Login</a></div></section><a class="back-link" href="./index.html">← Back to Store</a></main><script type="module" src="./customer-auth.js"></script></body></html>
