<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Password Reset | WS TOP UP</title><link rel="stylesheet" href="./customer-auth.css"></head>
<body data-page="reset"><main class="auth-wrap"><div class="brand"><a href="./index.html">WS <span>TOP UP</span></a></div><section class="auth-card"><h1>Password Reset / পাসওয়ার্ড রিসেট</h1><p class="sub">ইমেইলে রিসেট লিংক পাঠাও। লিংক খুলে নতুন পাসওয়ার্ড সেট করতে পারবে।</p><form id="reset-form"><label for="email">Email Address / ইমেইল</label><input id="email" type="email" autocomplete="email" required><button type="submit">Send Reset Link</button></form><div id="message" class="message" role="status" aria-live="polite"></div><div id="new-password-wrap" hidden><hr style="border-color:#29415f;margin:22px 0"><form id="new-password-form"><label for="new-password">New Password / নতুন পাসওয়ার্ড</label><input id="new-password" type="password" minlength="8" autocomplete="new-password" required><label for="confirm-password">Confirm Password / আবার পাসওয়ার্ড</label><input id="confirm-password" type="password" minlength="8" autocomplete="new-password" required><button type="submit">Update Password</button></form></div><div class="auth-links"><a href="./login.html">Back to Login</a></div></section><a class="back-link" href="./index.html">← Back to Store</a></main><script type="module" src="./customer-auth.js"></script></body></html>
