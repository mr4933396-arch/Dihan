<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Reset | WS TOP UP</title><link rel="stylesheet" href="./assets/style.css"></head>
<body data-page="reset"><main class="auth-wrap"><div class="brand"><a href="../index.html">WS <span>TOP UP</span></a></div><section class="card"><h1>Password Recovery</h1><p class="sub">তোমার ইমেইলে পাসওয়ার্ড রিসেট লিংক পাঠাও।</p><form id="reset-form"><label for="email">Email Address</label><input id="email" type="email" autocomplete="email" required><button type="submit">Send Reset Link</button></form><div id="message" class="message" role="status"></div><hr style="border-color:#303653;margin:25px 0"><p class="sub">রিসেট লিংক থেকে ফিরে এলে এখানে নতুন পাসওয়ার্ড সেট করতে পারবে।</p><form id="new-password-form"><label for="new-password">New Password</label><input id="new-password" type="password" minlength="8" autocomplete="new-password" required><button type="submit">Update Password</button></form><div class="links"><a href="./login.html">Back to Login</a></div></section></main><script type="module" src="./assets/auth.js"></script></body></html>
