<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>New Products | WS TOP UP</title>
<style>
:root{--bg:#07111f;--panel:#102139;--line:#23405d;--text:#eef6ff;--muted:#9fb2c8;--blue:#3478f6;--cyan:#29d6e8;--gold:#ffc857}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#102b49 0,#07111f 50%);color:var(--text);font:15px/1.5 system-ui,sans-serif}
a{color:inherit;text-decoration:none}
.wrap{width:min(1100px,calc(100% - 24px));margin:auto}
.top{position:sticky;top:0;background:#07111fee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:3}
.nav{display:flex;justify-content:space-between;align-items:center;padding:13px 0}
.brand{font-size:21px;font-weight:900}
.brand b{color:var(--cyan)}
select,input{background:#091a2d;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;min-width:0}
.hero{padding:28px 0 15px}
.hero h1{font-size:clamp(26px,5vw,40px);margin:6px 0}
.muted{color:var(--muted)}
.search{width:100%;margin:10px 0}
.chips{display:flex;gap:8px;overflow:auto;padding:10px 0}
.chip{white-space:nowrap;border:1px solid var(--line);border-radius:99px;padding:8px 13px;background:#0b1b2e;color:var(--muted)}
.chip.active{background:#1b4c9a;color:white}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card,.panel{background:linear-gradient(145deg,#122943,#0b1b2e);border:1px solid var(--line);border-radius:16px;padding:14px}
.card{display:flex;flex-direction:column;gap:8px;min-height:160px;cursor:pointer}
.ico{width:48px;height:48px;display:grid;place-items:center;background:#1b3b5c;border-radius:14px;font-size:26px}
.card h3{margin:0;font-size:15px}
.card small{color:var(--muted)}
.tag{font-size:11px;color:#a8dfff;background:#123653;border-radius:20px;padding:4px 8px;align-self:flex-start}
.btn{border:0;border-radius:11px;padding:12px 15px;background:linear-gradient(90deg,var(--blue),#2460ce);color:white;font-weight:800;cursor:pointer}
.detail{padding:18px 0 35px}
.back{color:var(--cyan);display:inline-block;margin:8px 0 15px}
.head{display:flex;gap:13px;align-items:center}
.head .ico{width:60px;height:60px;font-size:30px}
.head h1{margin:0;font-size:24px}
.panel{margin:13px 0}
.panel h2{font-size:17px;margin:0 0 12px}
.packages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.pkg{border:1px solid var(--line);background:#091a2d;color:var(--text);border-radius:11px;padding:11px;text-align:left;cursor:pointer}
.pkg.selected{border:2px solid var(--cyan);background:#103453}
.pkg strong{display:block;font-size:13px}
.pkg span{display:block;color:var(--gold);font-weight:800;margin-top:4px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fields label{display:grid;gap:5px;color:var(--muted);font-size:12px}
.fields input{width:100%}
.summary{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:13px;margin-top:13px}
.note{font-size:12px;color:#ffd58a}
.hidden{display:none}
.footer{border-top:1px solid var(--line);padding:20px 0;margin-top:30px;color:var(--muted);font-size:12px}
@media(max-width:800px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{padding:11px;min-height:150px}.packages{grid-template-columns:repeat(2,minmax(0,1fr))}.fields{grid-template-columns:1fr}.brand{font-size:18px}}
</style>
</head>
<body>

<header class="top">
<div class="wrap nav">
<a class="brand" href="./index.html">WS <b>TOP UP</b></a>
<select id="currency">
<option value="BDT">৳ BDT</option>
<option value="INR">₹ INR</option>
</select>
</div>
</header>

<main class="wrap">
<section id="catalogView">
<div class="hero">
<div style="color:var(--cyan);font-weight:800;font-size:11px;letter-spacing:2px">NEW CATALOG ADDITIONS</div>
<h1>More Games & Digital Products</h1>
<p class="muted">Explore games, subscriptions and digital products at WS TOP UP.</p>
<input id="search" class="search" placeholder="Search new products...">
</div>
<div id="chips" class="chips"></div>
<div class="muted" id="count"></div>
<div class="grid" id="grid"></div>

<section id="detailView" class="detail hidden">
<a href="#" class="back" id="back">← BACK TO NEW PRODUCTS</a>

</main>

const INR_RATE = 0.7436;
let cat = "All";
let currency = "BDT";
let selected = -1;
let current = null;

const money = n => currency === "BDT"
? "৳" + Number(n).toLocaleString("en-IN",{maximumFractionDigits:1})
: "₹" + (Number(n)*INR_RATE).toLocaleString("en-IN",{maximumFractionDigits:2});

const cats = ["All",...new Set(PRODUCTS.map(p=>p.cat))];

function catalog(){
const q = document.querySelector("#search").value.toLowerCase();

const list = PRODUCTS.filter(p =>
(cat === "All" || p.cat === cat) &&
(p.name+" "+p.cat).toLowerCase().includes(q)
);

document.querySelector("#count").textContent =
list.length+" new products";

document.querySelector("#grid").innerHTML = list.map(p=>`
<article class="card" data-id="${p.id}">
<div class="ico">${p.icon}</div>
<h3>${p.name}</h3>
<small>${p.cat}</small>
<span class="tag">${p.packages.length} packages · Available</span>
</article>
`).join("");
}

document.querySelector("#chips").innerHTML = cats.map(c=>`
<button class="chip ${c==="All"?"active":""}" data-cat="${c}">${c}</button>
`).join("");

document.querySelector("#chips").addEventListener("click",e=>{
const b=e.target.closest("[data-cat]");
if(!b)return;
cat=b.dataset.cat;
document.querySelectorAll(".chip").forEach(x=>
x.classList.toggle("active",x===b)
);
catalog();
});

document.querySelector("#grid").addEventListener("click",e=>{
const c=e.target.closest("[data-id]");
if(c)openProduct(c.dataset.id);
});

document.querySelector("#search").addEventListener("input",catalog);

document.querySelector("#currency").addEventListener("change",e=>{
currency=e.target.value;
if(current)renderDetail();
catalog();
});

function openProduct(id){
current=PRODUCTS.find(p=>p.id===id);
selected=-1;
document.querySelector("#catalogView").classList.add("hidden");
document.querySelector("#detailView").classList.remove("hidden");
renderDetail();
window.scrollTo(0,0);
}

function renderDetail(){
const p=current;
const price=p.packages[selected];

document.querySelector("#detail").innerHTML=`
<div class="head">
<div class="ico">${p.icon}</div>
<div>
<small style="color:var(--cyan)">${p.cat}</small>
<h1>${p.name}</h1>
</div>
</div>

<div class="panel">
<h2>1. Select package</h2>
<div class="packages">
${p.packages.map((x,i)=>`
<button class="pkg ${i===selected?"selected":""}" data-pkg="${i}">
<strong>${x[0]}</strong>
<span>${money(x[1])}</span>
</button>
`).join("")}
</div>
</div>

<div class="panel">
<h2>2. Account information</h2>
<div class="fields">
${p.fields.map((f,i)=>`
<label>${f} *
<input id="f${i}" placeholder="Enter ${f}">
</label>
`).join("")}

<label>Country *
<select id="country">
<option value="">Select country</option>
<option>India</option>
<option>Bangladesh</option>
<option>Other</option>
</select>
</label>
</div>

<div class="summary">
<div>
<small class="muted">Selected price</small><br>
<b>${price?money(price[1]):"Select package"}</b>
</div>
<button class="btn" id="order">ORDER ON WHATSAPP</button>
</div>

<p class="note">
Please confirm the final price and availability with support before payment.
Never share passwords or OTPs.
</p>
</div>

${p.note?`<div class="panel"><p class="note">${p.note}</p></div>`:""}
`;

document.querySelectorAll("[data-pkg]").forEach(b=>{
b.addEventListener("click",()=>{
selected=Number(b.dataset.pkg);
renderDetail();
});
});

document.querySelector("#order").addEventListener("click",()=>{
if(selected<0){
alert("Select a package first.");
return;
}

const vals=p.fields.map((f,i)=>[
f,document.querySelector("#f"+i).value.trim()
]);

if(vals.some(v=>!v[1])){
alert("Fill all required fields.");
return;
}

const country=document.querySelector("#country").value;

if(!country){
alert("Select country.");
return;
}

const pack=price[0];
const ref=money(price[1]);

const msg =
`WS TOP UP NEW PRODUCT ORDER
Product: ${p.name}
Package: ${pack}
Reference price: ${ref}
${vals.map(v=>v[0]+": "+v[1]).join("\n")}
Country: ${country}
Please confirm my order.`;

window.open(
"https://wa.me/917814003979?text="+encodeURIComponent(msg),
"_blank"
);
});
}

document.querySelector("#back").addEventListener("click",e=>{
e.preventDefault();
document.querySelector("#detailView").classList.add("hidden");
document.querySelector("#catalogView").classList.remove("hidden");
current=null;
window.scrollTo(0,0);
});

catalog();
</script>

</html>
